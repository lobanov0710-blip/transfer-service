</head>

<body>

<h2>📊 CRM PRO 3.0</h2>

<div class="top-bar">

  <label>
    Статус:

      <option value="new">Новые</option>
      <option value="taken">Взятые</option>
      <option value="done">Завершённые</option>

  <label>
    Тариф:

      <option value="all">Все</option>
      <option value="comfort">Comfort</option>

      <option value="minivan">Minivan</option>
    </select>
